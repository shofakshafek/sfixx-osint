# ──────────────────────────────────────────────────────────────
#  Sfixx OSINT — konfigurasi default
#  Jalankan `sfixx config` untuk membuat salinan pribadi di
#  ~/.config/sfixx-osint/sfixx.conf — salinan itu TIDAK ditimpa
#  oleh `sfixx update`, jadi API key & pengaturanmu aman.
# ──────────────────────────────────────────────────────────────

DEFAULT_CC=62            # kode negara untuk nomor lokal (62 = Indonesia)
TIMEOUT=20               # timeout per request (detik)
THREADS=12               # request paralel (username / subdomain)
UA=""                    # kosong = User-Agent bawaan
REPORT_DIR="$HOME/sfixx-reports"
AUTO_SAVE=0              # 1 = selalu simpan laporan ke REPORT_DIR
OPEN_BROWSER=0           # 1 = buka tautan dork otomatis di browser
SUB_RESOLVE_MAX=40       # maksimal subdomain yang di-resolve ke IP

# ── API key opsional (kosongkan jika tidak dipakai) ──────────
IPINFO_TOKEN=""          # https://ipinfo.io        (cek silang IP)
ABUSEIPDB_KEY=""         # https://abuseipdb.com    (reputasi IP)
VIRUSTOTAL_KEY=""        # https://virustotal.com   (IP & URL)
HIBP_KEY=""              # https://haveibeenpwned.com (breach email)
NUMVERIFY_KEY=""         # https://numverify.com    (validasi nomor)
GITHUB_TOKEN=""          # naikkan rate-limit API GitHub
